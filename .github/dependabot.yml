version: 2

# One pull request a week for every ecosystem, majors included. Dependency
# changes then arrive as a single reviewable unit that CI checks as a whole,
# rather than as a queue where each bump is tested against dependencies the
# others are about to change. The cost is that one breaking major holds back
# the rest of the batch until it is fixed or ignored; that is the trade chosen.
#
# This applies to version updates only. Security updates are still raised one
# per advisory, as soon as the advisory is published, because a fix for a known
# vulnerability should not wait for Monday or for an unrelated major.
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Manila
    # Into the integration branch like every other change, so a dependency bump
    # is promoted to `main` with the rest of `dev` rather than landing on the
    # trunk on its own. Dependabot reads this file from the default branch only,
    # so a change here takes effect once it has been promoted.
    target-branch: dev
    commit-message:
      prefix: chore
      include: scope

updates:
  # Application and development dependencies, from `package.json` and the
  # lockfile. The web app is an npm workspace sharing that one lockfile, so its
  # dependencies are updated from here too.
  - package-ecosystem: npm
    directory: /
    multi-ecosystem-group: all-dependencies
    patterns: ["*"]
    ignore:
      # The type definitions describe the Node API the code is checked against,
      # so their major follows the runtime's rather than the newest release.
      # Types for a newer Node would typecheck calls that fail on the one the
      # image actually runs. Moved together with the Node major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Actions are pinned to commit SHAs, which is what stops a moved tag from
  # changing what runs here. Without this, pinning would decay into running
  # permanently outdated actions. Dependabot bumps the SHA and its trailing
  # version comment together.
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: all-dependencies
    patterns: ["*"]

  # Base images are pinned by digest in the Dockerfile, which has the same
  # decay problem as pinned actions: without an updater, pinning freezes the
  # runtime on an image that stops receiving patches. Dependabot rewrites the
  # `image:tag@sha256:...` reference in place, so the tag and the digest it
  # resolves to stay in step.
  #
  # The Postgres service image in `.github/workflows/container.yml` is not
  # covered: Dependabot does not read image references in workflow files, so
  # that digest is bumped by hand, as the comment beside it says.
  - package-ecosystem: docker
    directory: /
    multi-ecosystem-group: all-dependencies
    patterns: ["*"]
    ignore:
      # A Node major cannot move through this file alone. The runtime image is
      # `distroless/nodejs<major>-<debian>`, a different image name for each
      # major, so Dependabot bumps the build stage and leaves the runtime
      # behind. That is how the build and runtime came to disagree in #35.
      # A Node major is a deliberate change instead: both stages, `setup-node`
      # in the workflows, and `engines`, together.
      #
      # Revisit when Node 26 becomes LTS in late October 2026. Distroless
      # publishes it only on Debian 13, so that change also moves the image's
      # operating system.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
