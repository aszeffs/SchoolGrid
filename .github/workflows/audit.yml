name: Dependency audit

on:
  pull_request:
    branches: [dev, main]
  schedule:
    # Dependency review only inspects what a pull request adds. A CVE disclosed
    # against a package nobody is touching would otherwise never fail a build,
    # so the schedule is the half of this gate that earns its keep.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit the installed dependency tree
        # High rather than moderate. A gate that fires on advisories nobody is
        # going to act on gets muted, and a muted gate is not a gate.
        run: npm audit --audit-level=high
