name: Demo reset

on:
  # Nightly, at 02:00 in Asia/Manila, where the demo's visitors are. GitHub
  # runs schedules in UTC and with no guarantee of punctuality; a reset that
  # lands late is fine, because it depends on nothing but the deployment it
  # finds. Scheduled workflows run from the default branch alone.
  schedule:
    - cron: "0 18 * * *"
  # So a demo someone has made a mess of can be put back without waiting for
  # the night, and so the job can be proved to work when it is first added.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset:
    name: Verify, drop, migrate and reseed the demo
    runs-on: ubuntu-latest
    # The only holder of the owner's connection string, shared with the deploy
    # job in container.yml. A job in a pull request run cannot name it, so no
    # pull request, fork or branch can read it.
    environment:
      name: production
      url: ${{ env.PRODUCTION_URL }}
    # The same group as the deploy job, so a reset never drops the schema a
    # deploy is migrating, and a deploy never migrates a schema that is dropped
    # and not yet seeded. A reset that has started always finishes, which is
    # what matters: cancelled halfway it would leave the demo with no data at
    # all. A reset still *waiting* behind a deploy is a different thing, and
    # GitHub does cancel that one when a newer run queues into the group. The
    # demo then goes a night without a reset, and the next one puts it right.
    concurrency:
      group: production
      cancel-in-progress: false
    # Read-only. `attestations: read` is what the provenance check reads
    # through the GitHub API; nothing here writes to the registry or the
    # repository.
    permissions:
      contents: read
      attestations: read
    # A backstop. The reset itself is a handful of statements and one pull.
    timeout-minutes: 15
    env:
      # The digest is not named here: the script reads from the live
      # /api/build-info what production is actually running, so the image it
      # migrates with is the one already serving the database.
      IMAGE: ghcr.io/${{ github.repository }}
      # The production domain, which alone is outside Deployment Protection.
      # Public, so not a secret. The same literal as the deploy job's in
      # container.yml, and it must stay that way: pointed at anything else,
      # this would read one deployment's digest and drop another's database.
      PRODUCTION_URL: https://schoolgrid-phi.vercel.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job token would otherwise sit in `.git/config` for every later
          # step. Nothing here needs it: the checkout is only for the script
          # and demo/seed.sql.
          persist-credentials: false

      - name: Verify the digest, drop, migrate, reseed, and check
        # The owner's connection string is handed to this step alone.
        #
        # An empty Docker configuration, as in the deploy job: the image is
        # public, and the migration pulls it with no credential to lean on.
        #
        # `psql` is the runner image's. The SQL it carries is the repository's
        # seed and one DROP, neither of which needs a client as new as the
        # PostgreSQL 18 server it talks to.
        env:
          GH_TOKEN: ${{ github.token }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        shell: bash
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker"
          mkdir -p "$DOCKER_CONFIG"
          scripts/reset-demo.sh "$IMAGE" "$GITHUB_REPOSITORY" "$PRODUCTION_URL"
