name: Container

on:
  # Pull requests are where a bad image gets caught. The `dev` push build
  # exists only so the layer cache has a branch-scoped entry to warm: a cache
  # written from a pull request is scoped to that pull request, so without it
  # every new branch would install dependencies from cold. Neither trigger
  # publishes anything.
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  build:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Test the hardening checks
        # Before the build, because it needs no Docker and because a broken
        # check reports success rather than failing. Running it here means a
        # green job cannot mean the checks were silently inspecting nothing.
        run: scripts/verify-image.test.sh

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # Never, on either trigger. A vulnerable image should be caught
          # before it exists anywhere a deploy could reach; issue #18 adds
          # publication from `main` alone.
          push: false
          # Without this the image stays in the builder and the verification
          # step below has nothing to inspect.
          load: true
          tags: schoolgrid:${{ github.sha }}
          # Dependency installs dominate the build, and they only change when
          # the lockfile does. The cache is scoped to the repository by the
          # Actions cache service, so a fork's build cannot poison it.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the hardening properties of the image
        run: scripts/verify-image.sh "schoolgrid:${{ github.sha }}"

      - name: Export the image for the scan job
        # Handing the scan these exact bytes, rather than having it rebuild
        # from the same Dockerfile, is what makes "the image was scanned" mean
        # the image that was built. A rebuild is a second artifact, and a
        # floating dependency or a base-image tag moving between the two would
        # leave the scanned image and the built one quietly different.
        run: docker save --output image.tar "schoolgrid:${{ github.sha }}"

      - name: Upload the image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-image
          path: image.tar
          # Already-compressed layers; re-compressing them costs minutes and
          # saves almost nothing.
          compression-level: 0
          # A hand-off between two jobs of one run, not something to keep.
          retention-days: 1

  smoke:
    name: Container smoke test
    needs: build
    runs-on: ubuntu-latest
    services:
      # A real Postgres, because the failures this job exists for — a missing
      # `pg` in the runtime tree, a migration that breaks on boot — are exactly
      # the ones a fake database would hide. Pinned by digest like every other
      # image here. Dependabot does not update service images in workflows, so
      # this digest is bumped by hand alongside the embedded-postgres major.
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schoolgrid
        # Published on the host so both the script's `psql` and the container,
        # through `host-gateway`, reach the same database.
        ports:
          - 5432:5432
        # The job does not start until Postgres accepts connections, so a slow
        # database start cannot read as an image that failed to reach it.
        options: >-
          --health-cmd "pg_isready --username postgres --dbname schoolgrid"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    # A backstop behind the script's own deadline, so a hang in something the
    # deadline does not cover still ends in minutes rather than at the runner's
    # six-hour limit.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Test the smoke test
        # Before the image is loaded, for the same reason the hardening checks
        # are tested first: a polling script that cannot fail reports success,
        # and a green job must not mean the check was never really made.
        run: scripts/smoke-test.test.sh

      - name: Download the image built above
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: container-image

      - name: Load the image
        # The exact bytes the build job verified and the scan job scans, not a
        # rebuild of the same Dockerfile.
        run: docker load --input image.tar

      - name: Boot the image against Postgres
        # No migrate step before this, anywhere in the job. The script proves
        # the container migrated on startup by finding the database empty first;
        # migrating here would make that proof pass whatever the image does.
        run: scripts/smoke-test.sh "schoolgrid:${{ github.sha }}"

  scan:
    name: Trivy image scan
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Widened only here, and only far enough to write findings to the
      # Security tab, where they sit beside the CodeQL results rather than in a
      # log nobody opens.
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Check the recorded exceptions
        # First, and gating. Trivy honours an exception with no justification
        # and no expiry, and such an entry is the gate being switched off for
        # one finding, forever, by someone who left no record of why. Running
        # this before the scans means a malformed exception fails as itself
        # rather than as a scan that mysteriously found nothing.
        # `tee` rather than `>>`: redirecting stdout to the summary alone would
        # leave a developer opening the red step looking at an empty log.
        #
        # `pipefail` is not optional here. The default shell for a `run` step is
        # `bash -e`, without it, so the pipeline would report `tee`'s exit code
        # and this gate would pass however loudly the check failed.
        run: |
          set -o pipefail
          node scripts/check-trivy-exceptions.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Download the image built above
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: container-image

      # Each scan runs twice, and the order is load-bearing. The reporting run
      # never fails, so its SARIF is uploaded before the gating run can end the
      # job; findings reach the Security tab even on the builds that go red,
      # which are the builds where seeing them matters. The gating run then
      # prints a table, because a developer looking at a red job needs the
      # CVE in the log rather than a link to go and read.

      - name: Scan the image and report every finding
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          # `input` rather than `image-ref`, so the scan reads the tar the build
          # job produced instead of resolving a tag to whatever it points at now.
          input: image.tar
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"
          # No severity filter and `limit-severities-for-sarif` left off, so
          # every severity reaches the Security tab. Severity decides what
          # blocks a merge, below; it should not decide what is visible.
          #
          # Exceptions are applied here as well, which is the one thing this
          # report does leave out. That is deliberate: the Security tab then
          # holds what is unaccounted for, and `.trivyignore.yaml` holds what
          # is accounted for, each with a reason and a date. Findings shown in
          # both places would make the tab a list nobody can act on.
          trivyignores: .trivyignore.yaml

      - name: Upload the image findings
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Fail on high or critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: image.tar
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          # `ignore-unfixed` is deliberately off. It would drop exactly the
          # findings the exception process exists for — the ones with no patch
          # available — and drop them silently, with no justification and no
          # expiry. An unfixable CVE is a decision to record, not one to
          # configure away.
          trivyignores: .trivyignore.yaml
          # The binary and the vulnerability database are already in the
          # workspace from the run above.
          skip-setup-trivy: true

      - name: Scan the Dockerfile and report every misconfiguration
        # A base image choice does not prevent the hardening mistakes that live
        # in the Dockerfile itself, and those are one-line changes that read as
        # harmless in review.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          format: sarif
          output: trivy-dockerfile.sarif
          exit-code: "0"
          trivyignores: .trivyignore.yaml
          skip-setup-trivy: true

      - name: Upload the Dockerfile findings
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-dockerfile.sarif
          # A separate category, so the two scans do not overwrite each other's
          # results in the Security tab.
          category: trivy-dockerfile

      - name: Fail on high or critical Dockerfile misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore.yaml
          skip-setup-trivy: true
