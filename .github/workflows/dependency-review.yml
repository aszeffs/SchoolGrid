name: Dependency review

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependencies introduced by this PR
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
          # Copyleft licences would force disclosure of a system holding
          # student records. Flag them for a decision rather than absorbing
          # them silently through a transitive dependency.
          deny-licenses: AGPL-3.0, GPL-3.0
